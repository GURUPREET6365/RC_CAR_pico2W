<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <title>ATLAS CAR Controller</title>

    <style>

        /* ================================
           GLOBAL
        ================================= */

        * {
            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
        }

        html,
        body {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            touch-action: none;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            background: #151515;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 15px;
        }


        /* ================================
           MAIN CONTROLLER
        ================================= */

        .controller {
            width: 100%;
            max-width: 430px;

            text-align: center;
        }


        /* ================================
           TITLE
        ================================= */

        h1 {
            margin: 0;

            font-size: 27px;
            font-weight: 700;

            letter-spacing: 2px;
        }

        .status {
            margin-top: 5px;
            margin-bottom: 18px;

            font-size: 14px;

            color: #999;
        }

        #currentGear {
            color: #4da3ff;
            font-weight: bold;
        }


        /* ================================
           GEAR
        ================================= */

        .gear-title {
            font-size: 13px;

            color: #888;

            margin-bottom: 9px;

            letter-spacing: 1px;
        }

        .gears {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 12px;

            margin-bottom: 28px;
        }

        .gear {
            width: 75px;
            height: 52px;

            border: 2px solid #3d3d3d;

            border-radius: 13px;

            background: #242424;
            color: white;

            font-size: 19px;
            font-weight: bold;

            touch-action: manipulation;

            transition:
                background 0.1s,
                border-color 0.1s,
                transform 0.08s;
        }

        .gear.selected {
            background: #087ff5;

            border-color: #4da3ff;

            box-shadow:
                0 0 15px rgba(8, 127, 245, 0.45);
        }

        .gear:active {
            transform: scale(0.94);
        }


        /* ================================
           REMOTE CONTROLS
        ================================= */

        .remote-controls {
            width: 100%;

            display: flex;

            justify-content: space-around;
            align-items: center;

            padding: 5px 10px;

            margin: 0 auto;
        }


        /* ================================
           CONTROL COLUMN
        ================================= */

        .control-column {
            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 20px;
        }


        /* ================================
           DRIVE BUTTONS
        ================================= */

        .drive {
            width: 125px;
            height: 125px;

            border: none;

            border-radius: 32px;

            background: #292929;

            color: white;

            font-size: 45px;
            font-weight: bold;

            display: flex;

            justify-content: center;
            align-items: center;

            box-shadow:
                0 7px 0 #0c0c0c,
                0 12px 20px rgba(0, 0, 0, 0.35);

            touch-action: none;

            transition:
                transform 0.07s,
                background 0.07s,
                box-shadow 0.07s;
        }


        /*
         * Button while pressed
         */

        .drive.active,
        .drive:active {

            background: #087ff5;

            transform: translateY(6px);

            box-shadow:
                0 1px 0 #0c0c0c,
                0 4px 10px rgba(0, 0, 0, 0.3);
        }


        /* ================================
           STOP BUTTON
        ================================= */

        .stop {
            width: 240px;
            height: 65px;

            margin-top: 30px;

            border: none;

            border-radius: 17px;

            background: #d32f2f;

            color: white;

            font-size: 21px;
            font-weight: bold;

            letter-spacing: 1px;

            box-shadow:
                0 6px 0 #791919,
                0 10px 18px rgba(0, 0, 0, 0.3);

            touch-action: manipulation;

            transition:
                transform 0.07s,
                box-shadow 0.07s;
        }

        .stop:active {

            transform: translateY(5px);

            box-shadow:
                0 1px 0 #791919,
                0 4px 8px rgba(0, 0, 0, 0.3);
        }


        /* ================================
           SMALL PHONES
        ================================= */

        @media (max-height: 700px) {

            h1 {
                font-size: 23px;
            }

            .status {
                margin-bottom: 10px;
            }

            .gears {
                margin-bottom: 15px;
            }

            .drive {
                width: 95px;
                height: 95px;

                border-radius: 26px;

                font-size: 35px;
            }

            .control-column {
                gap: 15px;
            }

            .stop {
                margin-top: 18px;

                height: 55px;
            }
        }


        /* ================================
           VERY SMALL PHONES
        ================================= */

        @media (max-width: 350px) {

            .drive {
                width: 85px;
                height: 85px;

                font-size: 32px;
            }

            .gear {
                width: 65px;
            }

            .stop {
                width: 210px;
            }
        }

    </style>
</head>


<body>

    <div class="controller">


        <!-- =================================
             TITLE
        ================================== -->

        <h1>
            ATLAS CAR
        </h1>

        <div class="status">
            Gear:
            <strong id="currentGear">1</strong>
        </div>


        <!-- =================================
             GEAR SELECTOR
        ================================== -->

        <div class="gear-title">
            SELECT GEAR
        </div>

        <div class="gears">

            <button
                class="gear selected"
                data-gear="1"
            >
                1
            </button>

            <button
                class="gear"
                data-gear="2"
            >
                2
            </button>

            <button
                class="gear"
                data-gear="3"
            >
                3
            </button>

        </div>


        <!-- =================================
             RC REMOTE CONTROLS
        ================================== -->

        <div class="remote-controls">

    <!-- LEFT SIDE
         LEFT / RIGHT
    -->

    <div class="control-column">

        <button
            class="drive"
            data-command="/left"
            aria-label="Left"
        >
            ◀
        </button>

        <button
            class="drive"
            data-command="/right"
            aria-label="Right"
        >
            ▶
        </button>

    </div>


    <!-- RIGHT SIDE
         FORWARD / BACKWARD
    -->

    <div class="control-column">

        <button
            class="drive"
            data-command="/forward"
            aria-label="Forward"
        >
            ▲
        </button>

        <button
            class="drive"
            data-command="/backward"
            aria-label="Backward"
        >
            ▼
        </button>

    </div>

</div>


        <!-- =================================
             STOP
        ================================== -->

        <button
            class="stop"
            id="stopButton"
        >
            STOP
        </button>

    </div>


    <script>


        /* ==========================================
           STATE
        ========================================== */

        let activeButton = null;

        let currentGear = 1;


        /* ==========================================
           SEND COMMAND
        ========================================== */

        function sendCmd(command) {

            fetch(command, {
                method: "GET",
                cache: "no-store"
            })
            .catch(() => {});

            console.log("Command:", command);
        }


        /* ==========================================
           GEAR SELECTION
        ========================================== */

        const gearButtons =
            document.querySelectorAll(".gear");

        const currentGearText =
            document.getElementById("currentGear");


        gearButtons.forEach(button => {

            button.addEventListener(
                "click",
                () => {

                    const gear =
                        button.dataset.gear;


                    currentGear = gear;


                    /*
                     * Remove selection
                     * from all gears.
                     */

                    gearButtons.forEach(g => {

                        g.classList.remove(
                            "selected"
                        );

                    });


                    /*
                     * Select current gear.
                     */

                    button.classList.add(
                        "selected"
                    );


                    /*
                     * Update text.
                     */

                    currentGearText.textContent =
                        gear;


                    /*
                     * Send command.
                     *
                     * /gear/1
                     * /gear/2
                     * /gear/3
                     */

                    sendCmd(
                        `/gear/${gear}`
                    );

                }
            );

        });


        /* ==========================================
           START MOVEMENT
        ========================================== */

        function startDrive(button) {


            /*
             * If another movement is already
             * active, stop it first.
             */

            if (
                activeButton !== null &&
                activeButton !== button
            ) {

                stopDrive();

            }


            activeButton = button;


            /*
             * Visual feedback.
             */

            button.classList.add(
                "active"
            );


            /*
             * Send movement command.
             */

            sendCmd(
                button.dataset.command
            );

        }


        /* ==========================================
           STOP MOVEMENT
        ========================================== */

        function stopDrive() {


            if (activeButton !== null) {

                activeButton.classList.remove(
                    "active"
                );

                activeButton = null;

            }


            /*
             * Tell car to stop.
             */

            sendCmd("/stop");

        }


        /* ==========================================
           DRIVE BUTTONS
        ========================================== */

        const driveButtons =
            document.querySelectorAll(".drive");


        driveButtons.forEach(button => {


            /*
             * Finger touches button.
             */

            button.addEventListener(
                "pointerdown",
                event => {

                    event.preventDefault();


                    /*
                     * Keep receiving pointer
                     * events even if finger
                     * moves slightly.
                     */

                    button.setPointerCapture(
                        event.pointerId
                    );


                    startDrive(button);

                }
            );


            /*
             * Finger released.
             */

            button.addEventListener(
                "pointerup",
                event => {

                    event.preventDefault();

                    stopDrive();

                }
            );


            /*
             * Finger cancelled.
             */

            button.addEventListener(
                "pointercancel",
                event => {

                    event.preventDefault();

                    stopDrive();

                }
            );


            /*
             * Pointer capture lost.
             */

            button.addEventListener(
                "lostpointercapture",
                () => {

                    stopDrive();

                }
            );

        });


        /* ==========================================
           STOP BUTTON
        ========================================== */

        const stopButton =
            document.getElementById(
                "stopButton"
            );


        stopButton.addEventListener(
            "pointerdown",
            event => {

                event.preventDefault();

                stopDrive();

            }
        );


        /* ==========================================
           SAFETY
        ========================================== */


        /*
         * Browser loses focus.
         *
         * STOP.
         */

        window.addEventListener(
            "blur",
            () => {

                stopDrive();

            }
        );


        /*
         * User changes app/tab.
         *
         * STOP.
         */

        document.addEventListener(
            "visibilitychange",
            () => {

                if (document.hidden) {

                    stopDrive();

                }

            }
        );


        /*
         * Prevent long-press context menu.
         */

        document.addEventListener(
            "contextmenu",
            event => {

                event.preventDefault();

            }
        );


        /*
         * Prevent accidental scrolling.
         */

        document.addEventListener(
            "touchmove",
            event => {

                event.preventDefault();

            },
            {
                passive: false
            }
        );

    </script>

</body>

</html>
